# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: "zeroct's blog"
subtitle: ''
description: '记录技术，也记录生活'
keywords: 'Zeroct,博客,安全,开发,笔记'
author: Zeroct
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## Set your site url here.
url: https://zeroct0.github.io
permalink: post/:abbrlink.html
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# abbrlink: 把文章路径变成 post/<crc32 hex>.html，避免中文标题产生长 URL
abbrlink:
  alg: crc32
  rep: hex
  drafts: false
  force: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: false
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: butterfly

# 本地搜索（配合主题的 local_search 使用）
search:
  path: search.json
  field: post
  content: true
  format: striptags

# RSS 订阅
feed:
  type: atom
  path: atom.xml
  limit: 20
  content: true
  content_limit: 140

# 站点地图，便于搜索引擎收录
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Deployment
## 由 .github/workflows/deploy.yml 自动构建部署，此处在本地无需配置
deploy:
  type: ''
